<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">GDUF Quant Lab</title>
  <desc id="desc">Open-source quantitative research at Guangdong University of Finance, supported by GJ Quantitative Investment Studio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="62%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f8fa"/>
    </linearGradient>
    <linearGradient id="redText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9f0a0a"/>
      <stop offset="100%" stop-color="#d71920"/>
    </linearGradient>
    <linearGradient id="iconRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1f2d"/>
      <stop offset="100%" stop-color="#d80716"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c6ccd4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c6ccd4" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>

  <!-- subtle chart grid -->
  <g opacity="0.10" stroke="#a8afb8" stroke-width="1">
    <line x1="930" y1="70" x2="1580" y2="70"/>
    <line x1="930" y1="130" x2="1580" y2="130"/>
    <line x1="930" y1="190" x2="1580" y2="190"/>
    <line x1="930" y1="250" x2="1580" y2="250"/>
    <line x1="980" y1="40" x2="980" y2="330"/>
    <line x1="1080" y1="40" x2="1080" y2="330"/>
    <line x1="1180" y1="40" x2="1180" y2="330"/>
    <line x1="1280" y1="40" x2="1280" y2="330"/>
    <line x1="1380" y1="40" x2="1380" y2="330"/>
    <line x1="1480" y1="40" x2="1480" y2="330"/>
  </g>

  <!-- main typography -->
  <text x="62" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="url(#redText)">GDUF</text>
  <text x="332" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#111827">Quant Lab</text>
  <text x="64" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="0.5" fill="#1f2937">Open-source Quantitative Research</text>
  <line x1="66" y1="247" x2="126" y2="247" stroke="#c9151e" stroke-width="4" stroke-linecap="round"/>
  <text x="145" y="255" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="2.4" fill="#6b7280">Guangdong University of Finance</text>

  <!-- research / engineering / education -->
  <g transform="translate(66,315)">
    <g fill="none" stroke="#bf1219" stroke-width="3">
      <rect x="0" y="21" width="8" height="22"/>
      <rect x="14" y="12" width="8" height="31"/>
      <rect x="28" y="3" width="8" height="40"/>
    </g>
    <text x="55" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#2f3640">Research</text>

    <line x1="180" y1="10" x2="180" y2="42" stroke="#68707c" stroke-width="2"/>

    <g transform="translate(215,4)" fill="none" stroke="#bf1219" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18,6 2,21 18,36"/>
      <polyline points="44,6 60,21 44,36"/>
      <line x1="37" y1="1" x2="25" y2="41"/>
    </g>
    <text x="292" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#2f3640">Engineering</text>

    <line x1="455" y1="10" x2="455" y2="42" stroke="#68707c" stroke-width="2"/>

    <g transform="translate(500,0)" fill="none" stroke="#bf1219" stroke-width="3" stroke-linejoin="round">
      <polygon points="0,16 28,2 56,16 28,30"/>
      <path d="M10,22 v17 c12,8 24,8 36,0 V22"/>
      <line x1="56" y1="16" x2="56" y2="37"/>
    </g>
    <text x="575" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#2f3640">Education</text>
  </g>

  <!-- supported by -->
  <text x="66" y="426" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#5f6670">Supported by</text>
  <g transform="translate(205,389)">
    <rect x="0" y="0" width="54" height="54" rx="12" fill="url(#iconRed)"/>
    <path d="M13 39 L23 21 L31 34 L39 18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 18 L43 13 L42 22" fill="#fff"/>
  </g>
  <text x="276" y="416" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif" font-size="24" font-weight="700" fill="#111">广金量化投资工作室</text>
  <text x="276" y="441" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="600" fill="#222">GJ Quantitative Investment Studio</text>

  <!-- top-right motto -->
  <text x="1190" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="5" fill="#4b5563">DATA DRIVES A BETTER TOMORROW</text>
  <line x1="1512" y1="43" x2="1570" y2="43" stroke="#c9151e" stroke-width="2"/>

  <!-- campus silhouette -->
  <g opacity="0.55" stroke="#aeb5bd" fill="url(#fade)">
    <rect x="1080" y="266" width="130" height="100"/>
    <rect x="1210" y="220" width="250" height="146"/>
    <rect x="1330" y="192" width="190" height="174"/>
    <rect x="1408" y="172" width="82" height="194"/>
    <rect x="1035" y="298" width="66" height="68"/>
    <rect x="1130" y="245" width="12" height="121" fill="#fff" opacity="0.55"/>
    <rect x="1160" y="245" width="12" height="121" fill="#fff" opacity="0.55"/>
    <rect x="1245" y="244" width="16" height="122" fill="#fff" opacity="0.55"/>
    <rect x="1280" y="244" width="16" height="122" fill="#fff" opacity="0.55"/>
    <rect x="1450" y="188" width="18" height="178" fill="#fff" opacity="0.55"/>
  </g>

  <!-- trees -->
  <g opacity="0.45" fill="#a6adb6">
    <circle cx="1100" cy="338" r="25"/><rect x="1097" y="338" width="6" height="30"/>
    <circle cx="1185" cy="338" r="21"/><rect x="1182" y="338" width="6" height="30"/>
    <circle cx="1540" cy="334" r="28"/><rect x="1537" y="334" width="6" height="34"/>
  </g>

  <!-- candlestick chart -->
  <g stroke-width="1.5">
    <g stroke="#d2d6dc" fill="#eceff2">
      <line x1="1040" y1="180" x2="1040" y2="260"/><rect x="1032" y="205" width="16" height="30"/>
      <line x1="1080" y1="160" x2="1080" y2="245"/><rect x="1072" y="185" width="16" height="35"/>
      <line x1="1120" y1="142" x2="1120" y2="220"/><rect x="1112" y="162" width="16" height="34"/>
      <line x1="1160" y1="155" x2="1160" y2="230"/><rect x="1152" y="180" width="16" height="30"/>
      <line x1="1200" y1="130" x2="1200" y2="208"/><rect x="1192" y="152" width="16" height="34"/>
      <line x1="1240" y1="112" x2="1240" y2="190"/><rect x="1232" y="136" width="16" height="30"/>
      <line x1="1280" y1="126" x2="1280" y2="202"/><rect x="1272" y="150" width="16" height="28"/>
      <line x1="1320" y1="112" x2="1320" y2="188"/><rect x="1312" y="132" width="16" height="32"/>
      <line x1="1360" y1="96" x2="1360" y2="173"/><rect x="1352" y="118" width="16" height="32"/>
      <line x1="1400" y1="110" x2="1400" y2="182"/><rect x="1392" y="132" width="16" height="30"/>
      <line x1="1440" y1="80" x2="1440" y2="155"/><rect x="1432" y="102" width="16" height="30"/>
      <line x1="1480" y1="65" x2="1480" y2="138"/><rect x="1472" y="86" width="16" height="29"/>
      <line x1="1520" y1="54" x2="1520" y2="127"/><rect x="1512" y="72" width="16" height="31"/>
    </g>
    <g stroke="#e1a5a8" fill="#f5d9db">
      <line x1="1100" y1="150" x2="1100" y2="230"/><rect x="1092" y="174" width="16" height="33"/>
      <line x1="1260" y1="100" x2="1260" y2="185"/><rect x="1252" y="127" width="16" height="36"/>
      <line x1="1380" y1="85" x2="1380" y2="170"/><rect x="1372" y="110" width="16" height="34"/>
      <line x1="1460" y1="72" x2="1460" y2="146"/><rect x="1452" y="92" width="16" height="30"/>
    </g>
  </g>

  <!-- rising research line -->
  <path d="M930 318 C1040 300, 1110 285, 1195 255 S1360 205, 1440 168 S1530 108, 1570 72"
        fill="none" stroke="#d62228" stroke-width="2.2" opacity="0.7"/>
  <polygon points="1570,72 1554,82 1560,62" fill="#d62228" opacity="0.75"/>

  <!-- bottom waves -->
  <g fill="none" stroke="#b9bec5" stroke-width="0.8" opacity="0.28">
    <path d="M0 430 C230 350 420 485 620 422 S960 355 1160 438 S1430 460 1600 410"/>
    <path d="M0 442 C230 362 420 497 620 434 S960 367 1160 450 S1430 472 1600 422"/>
    <path d="M0 454 C230 374 420 509 620 446 S960 379 1160 462 S1430 484 1600 434"/>
    <path d="M0 466 C230 386 420 521 620 458 S960 391 1160 474 S1430 496 1600 446"/>
  </g>
  <path d="M0 448 C230 370 420 500 620 438 S960 372 1160 451 S1430 475 1600 423"
        fill="none" stroke="#d62228" stroke-width="1.4" opacity="0.55"/>

  <text x="1265" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="5" fill="#555f6b">KNOWLEDGE · MODELS · IMPACT</text>
</svg>